<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KaagazAI - PDF Tools & AI Document Platform</title>
  <script>/*DEBUG-ERR*/function show(m){document.body.innerHTML="<pre style='color:#ff6b6b;background:#111;padding:20px;white-space:pre-wrap;font-size:14px'>"+m+"</pre>"};window.addEventListener("error",function(e){show("ERROR: "+e.message+"\n"+e.filename+":"+e.lineno+":"+e.colno+"\n"+(e.error&&e.error.stack||""))});window.addEventListener("unhandledrejection",function(e){show("PROMISE ERROR: "+(e.reason&&e.reason.stack||e.reason))});</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
